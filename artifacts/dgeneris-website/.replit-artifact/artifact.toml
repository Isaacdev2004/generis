kind = "web"
previewPath = "/"
title = "Dgeneris Bid & Tender Solutions"
version = "1.0.0"
id = "artifacts/dgeneris-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19881

[services.development]
run = "pnpm --filter @workspace/dgeneris-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dgeneris-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/dgeneris-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19881"
BASE_PATH = "/"
